<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이슈 확정</title>
<style>
:root {
  color-scheme: light dark;
  --bg: var(--color-background-primary, #ffffff); --panel: var(--color-background-secondary, #f6f7f9);
  --text: var(--color-text-primary, #1d2330); --muted: var(--color-text-secondary, #5d6675);
  --line: var(--color-border-primary, #d9dde4); --accent: #2459c9; --accent-text: #ffffff;
  --ok: var(--color-text-success, #1d7a46); --ok-bg: var(--color-background-success, #e3f4ea);
  --err: var(--color-text-danger, #b3261e); --err-bg: var(--color-background-danger, #fbe5e3);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--color-background-primary, #1d2128); --panel: var(--color-background-secondary, #262b33);
    --text: var(--color-text-primary, #e4e7ec); --muted: var(--color-text-secondary, #9aa3b2);
    --line: var(--color-border-primary, #343a45); --accent: #7aa2ff; --accent-text: #10131a;
    --ok: var(--color-text-success, #6fd39b); --ok-bg: var(--color-background-success, #1d3a2a);
    --err: var(--color-text-danger, #ff8a80); --err-bg: var(--color-background-danger, #45201e);
  }
}
:root[data-theme="dark"] {
  --bg: var(--color-background-primary, #1d2128); --panel: var(--color-background-secondary, #262b33);
  --text: var(--color-text-primary, #e4e7ec); --muted: var(--color-text-secondary, #9aa3b2);
  --line: var(--color-border-primary, #343a45); --accent: #7aa2ff; --accent-text: #10131a;
  --ok: var(--color-text-success, #6fd39b); --ok-bg: var(--color-background-success, #1d3a2a);
  --err: var(--color-text-danger, #ff8a80); --err-bg: var(--color-background-danger, #45201e);
}
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
  font: 14px/1.55 var(--font-sans, system-ui, "Malgun Gothic", sans-serif); }
h1 { font-size: 16px; margin: 0 0 4px; }
.hint, .muted { color: var(--muted); }
.hint { margin: 0 0 12px; }
dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 0 0 12px;
  padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
dt { color: var(--muted); font-size: 12px; }
dd { margin: 0; overflow-wrap: anywhere; }
label { display: block; margin: 0 0 10px; font-weight: 600; }
input, select, textarea, button { font: inherit; color: inherit; }
input, select, textarea { display: block; width: 100%; margin-top: 4px; padding: 6px 8px; font-weight: 400;
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
textarea { min-height: 96px; resize: vertical; }
.actions { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
button { cursor: pointer; padding: 6px 16px; border: 1px solid var(--accent); border-radius: 6px;
  background: var(--accent); color: var(--accent-text); font-weight: 600; }
button:disabled, input:disabled, select:disabled, textarea:disabled { cursor: not-allowed; opacity: 0.6; }
.message { margin: 12px 0 0; padding: 8px 12px; border-radius: 6px; background: var(--panel); }
.message.ok { color: var(--ok); background: var(--ok-bg); }
.message.err { color: var(--err); background: var(--err-bg); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <p id="status" class="message">초안을 불러오는 중입니다.</p>
  <section id="form" hidden>
    <h1>이슈 등록 확인</h1>
    <p class="hint">Claude가 만든 초안입니다. 내용을 확인하고 필요하면 고친 뒤 확정하세요. 확정 전에는 이슈가 등록되지 않습니다.</p>
    <dl>
      <div><dt>라인</dt><dd id="line"></dd></div>
      <div><dt>생산일</dt><dd id="date"></dd></div>
      <div><dt>근거 조회</dt><dd id="evidence"></dd></div>
      <div><dt>초안 유효 시간</dt><dd id="expires"></dd></div>
    </dl>
    <label>제목<input id="title" maxlength="200"></label>
    <label>심각도
      <select id="severity">
        <option value="low">낮음 (low)</option>
        <option value="medium">보통 (medium)</option>
        <option value="high">높음 (high)</option>
      </select>
    </label>
    <label>설명<textarea id="description" maxlength="5000"></textarea></label>
    <div class="actions">
      <button id="confirm" type="button">확정</button>
      <span id="changes" class="muted"></span>
    </div>
    <p id="result" class="message" role="status" hidden></p>
  </section>
</main>
<script>
(() => {
  'use strict';
  // MCP Apps View protocol (spec 2026-01-26): JSON-RPC 2.0 over postMessage with the host window only.
  const PROTOCOL_VERSION = '2026-01-26';
  const FIELDS = { title: '제목', severity: '심각도', description: '설명' };
  const SEVERITY = { low: '낮음', medium: '보통', high: '높음' };
  const $ = id => document.getElementById(id);
  const pending = new Map();
  let nextId = 1, draft = null, draftId = null, busy = false, done = false;

  const send = message => window.parent.postMessage({ jsonrpc: '2.0', ...message }, '*');
  const notify = (method, params = {}) => send({ method, params });
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++;
    pending.set(id, { resolve, reject });
    send({ id, method, params });
  });

  window.addEventListener('message', event => {
    if (event.source !== window.parent) return;
    const m = event.data;
    if (!m || typeof m !== 'object' || m.jsonrpc !== '2.0') return;
    if ('id' in m && !('method' in m)) {
      const p = pending.get(m.id);
      if (!p) return;
      pending.delete(m.id);
      if (m.error) p.reject(new Error(m.error.message || '요청이 거절되었습니다.')); else p.resolve(m.result);
      return;
    }
    if ('id' in m) {
      if (m.method === 'ping' || m.method === 'ui/resource-teardown') send({ id: m.id, result: {} });
      else send({ id: m.id, error: { code: -32601, message: 'Method not found' } });
      return;
    }
    if (m.method === 'ui/notifications/tool-result') showDraft(m.params);
    else if (m.method === 'ui/notifications/tool-cancelled') showStatus('초안 생성이 취소되었습니다.', 'err');
    else if (m.method === 'ui/notifications/host-context-changed') applyContext(m.params);
  });

  function applyContext(context) {
    if (!context || typeof context !== 'object') return;
    const root = document.documentElement;
    if (context.theme === 'light' || context.theme === 'dark') { root.dataset.theme = context.theme; root.style.colorScheme = context.theme; }
    const variables = context.styles && context.styles.variables;
    if (variables && typeof variables === 'object') {
      for (const [key, value] of Object.entries(variables)) if (key.startsWith('--') && typeof value === 'string') root.style.setProperty(key, value);
    }
  }
  function textOf(result) {
    const first = result && Array.isArray(result.content) ? result.content.find(c => c && c.type === 'text') : undefined;
    return first ? String(first.text).split('\n')[0] : '';
  }
  function showStatus(text, kind) {
    const status = $('status');
    status.textContent = text; status.className = 'message' + (kind ? ' ' + kind : ''); status.hidden = false;
    $('form').hidden = true;
  }
  function showResult(text, kind) {
    const result = $('result');
    result.textContent = text; result.className = 'message' + (kind ? ' ' + kind : ''); result.hidden = false;
  }
  function showDraft(result) {
    const body = result && result.structuredContent;
    if (!body || result.isError || !body.draftId || !body.draft) {
      showStatus((body && (body.message || body.summary)) || textOf(result) || '초안을 만들지 못했습니다.', 'err');
      return;
    }
    draft = body.draft; draftId = String(body.draftId);
    $('line').textContent = draft.lineId;
    $('date').textContent = draft.relatedDate;
    $('evidence').textContent = (draft.evidenceRefs || []).join(', ');
    const expires = new Date(body.expiresAt);
    $('expires').textContent = isNaN(expires.getTime()) ? '10분'
      : expires.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) + '까지';
    $('title').value = draft.title;
    $('severity').value = draft.severity;
    $('description').value = draft.description;
    $('status').hidden = true; $('form').hidden = false;
    showChanges();
  }
  function edits() {
    const out = {};
    const values = { title: $('title').value.trim(), severity: $('severity').value, description: $('description').value.trim() };
    for (const key of Object.keys(FIELDS)) if (values[key] !== draft[key]) out[key] = values[key];
    return out;
  }
  function showChanges() {
    if (!draft) return;
    const changed = edits();
    const parts = Object.keys(changed).map(key => key === 'severity'
      ? FIELDS[key] + ' ' + SEVERITY[draft.severity] + ' → ' + SEVERITY[changed.severity] : FIELDS[key]);
    $('changes').textContent = parts.length ? '수정: ' + parts.join(', ') : '수정 없음';
  }
  function setBusy(value) {
    busy = value;
    for (const id of ['title', 'severity', 'description', 'confirm']) $(id).disabled = busy || done;
  }
  for (const id of ['title', 'severity', 'description']) $(id).addEventListener('input', showChanges);

  $('confirm').addEventListener('click', async () => {
    if (busy || done || !draftId) return;
    if (!$('title').value.trim() || !$('description').value.trim()) { showResult('제목과 설명을 입력하세요.', 'err'); return; }
    setBusy(true);
    showResult('확정 요청 중입니다.', '');
    try {
      const result = await request('tools/call', { name: 'confirm_issue', arguments: { draftId, edits: edits() } });
      const body = (result && result.structuredContent) || {};
      if (!result.isError && body.ok === true) {
        done = true;
        showResult('등록되었습니다. 이슈 번호 ' + body.issueId, 'ok');
        return;
      }
      // Only a duplicate title leaves the draft usable; the person may change the title and confirm again.
      if (['expired', 'already_used', 'not_found'].includes(body.reason)) done = true;
      showResult((body.message || textOf(result) || '확정하지 못했습니다.')
        + (body.reason === 'expired' ? ' Claude에게 새 미리보기를 요청하세요.' : ''), 'err');
    } catch (error) {
      showResult('확정 요청이 처리되지 않았습니다. ' + (error && error.message ? error.message : ''), 'err');
    } finally {
      setBusy(false);
    }
  });

  let lastWidth = 0, lastHeight = 0, queued = false;
  function reportSize() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => {
      queued = false;
      const root = document.documentElement, saved = root.style.height;
      root.style.height = 'max-content';
      const height = Math.ceil(root.getBoundingClientRect().height);
      root.style.height = saved;
      const width = Math.ceil(window.innerWidth);
      if (width !== lastWidth || height !== lastHeight) {
        lastWidth = width; lastHeight = height;
        notify('ui/notifications/size-changed', { width, height });
      }
    });
  }

  request('ui/initialize', {
    appInfo: { name: 'shopfloor-issue-preview', version: '0.1.0' }, appCapabilities: {}, protocolVersion: PROTOCOL_VERSION,
  }).then(result => {
    applyContext(result && result.hostContext);
    notify('ui/notifications/initialized');
    const observer = new ResizeObserver(reportSize);
    observer.observe(document.documentElement); observer.observe(document.body);
    reportSize();
  }).catch(error => showStatus('화면을 연결하지 못했습니다. ' + (error && error.message ? error.message : ''), 'err'));
})();
</script>
</body>
</html>
